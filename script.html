
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防災情報・避難所マップ</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      line-height: 1.6;
    }

    button {
      padding: 10px 15px;
      margin: 5px 0;
      cursor: pointer;
    }

    #map {
      height: 500px;
      width: 100%;
      margin-top: 10px;
    }

    section {
      margin-top: 30px;
    }

    .info-links a {
      display: block;
      margin: 8px 0;
    }

    #table-container {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #f2f2f2;
      position: sticky;
      top: 0;
    }

    #quiz {
      max-width: 650px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #f8fbff;
    }

    #quiz fieldset {
      border: 1px solid #aaa;
      border-radius: 8px;
      padding: 15px;
    }

    .choice {
      display: block;
      padding: 8px;
      margin: 6px 0;
      cursor: pointer;
    }

    #quiz-result {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>防災情報・避難所マップ</h1>

  <!-- 現在地と避難所マップ -->
  <button onclick="getLocation()">
    現在地を取得して避難所を表示
  </button>

  <p id="result">ボタンを押して現在地を取得してください。</p>

  <h2>避難所マップ</h2>
  <div id="map"></div>

  <!-- 避難所一覧 -->
  <section id="csv-section" style="display:none;">
    <h2>避難所一覧</h2>
    <div id="table-container">
      <table id="shelter-table">
        <thead>
          <tr>
            <th>名称</th>
            <th>住所</th>
            <th>緯度</th>
            <th>経度</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- 災害情報リンク -->
  <section class="info-links">
    <h2>災害情報を確認する</h2>

    <a href="https://www.river.go.jp/" target="_blank" rel="noopener">
      国土交通省・川の防災情報
    </a>

    <a href="https://www.jma.go.jp/bosai/" target="_blank" rel="noopener">
      気象庁・防災情報
    </a>

    <a href="https://www.jma.go.jp/bosai/map.html#contents=earthquake"
       target="_blank" rel="noopener">
      気象庁・地震情報
    </a>

    <a href="https://www.jma.go.jp/bosai/map.html?contents=typhoon"
       target="_blank" rel="noopener">
      気象庁・台風情報
    </a>

    <a href="https://disaportal.gsi.go.jp/"
       target="_blank" rel="noopener">
      ハザードマップポータルサイト
    </a>
  </section>

  <!-- 防災意識チェック -->
  <section>
    <h2>防災意識チェック</h2>
    <p>
      10個の質問に回答して、自分の防災準備を確認しましょう。
      これは自己評価用の仮アンケートです。
    </p>

    <div id="quiz">
      <p id="quiz-progress">第1問 / 全10問</p>

      <div id="quiz-question"></div>
      <div id="quiz-choices"></div>

      <p id="quiz-message" role="status"></p>

      <button id="quiz-next" type="button" onclick="nextQuestion()">
        決定して次へ
      </button>

      <div id="quiz-finish" style="display:none;">
        <p id="quiz-result"></p>
        <p id="quiz-comment"></p>
        <button type="button" onclick="restartQuiz()">
          もう一度回答する
        </button>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // =========================
    // 地図の設定
    // =========================

    const map = L.map("map").setView([34.6853, 135.8050], 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution:
        '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const shelterIcon = L.icon({
      iconUrl:
        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
      shadowUrl:
        "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const shelterLayerGroup = L.layerGroup().addTo(map);
    let currentMarker = null;
    let routeLayer = null;

    // =========================
    // CSVの解析
    // =========================

    function parseCSVLine(line) {
      const values = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          values.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }

      values.push(current.trim());
      return values;
    }

    // =========================
    // 現在地の取得
    // =========================

    function getLocation() {
      const resultElement = document.getElementById("result");

      if (!navigator.geolocation) {
        resultElement.textContent =
          "このブラウザは位置情報に対応していません。";
        return;
      }

      resultElement.textContent = "現在地を取得中...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          resultElement.textContent =
            `現在地：緯度 ${lat.toFixed(4)}、経度 ${lng.toFixed(4)}`;

          map.setView([lat, lng], 15);

          if (currentMarker) {
            map.removeLayer(currentMarker);
          }

          currentMarker = L.marker([lat, lng])
            .addTo(map)
            .bindPopup("<b>あなたの現在地</b>")
            .openPopup();

          loadAndDisplayShelterCSV();
        },

        function() {
          resultElement.textContent =
            "現在地を取得できませんでした。位置情報の許可を確認してください。";
        },

        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // =========================
    // 避難所CSVの読み込み
    // =========================

    function loadAndDisplayShelterCSV() {
      fetch("29000_1.csv")
        .then(response => {
          if (!response.ok) {
            throw new Error("CSVを読み込めませんでした。");
          }
          return response.text();
        })
        .then(csvText => {
          const lines = csvText.trim().split(/\r?\n/);

          if (lines.length < 2) {
            throw new Error("CSVデータが空です。");
          }

          const headers = parseCSVLine(lines[0]);

          const nameIdx = headers.indexOf("名称") !== -1
            ? headers.indexOf("名称")
            : headers.indexOf("施設名称");

          const latIdx = headers.indexOf("緯度") !== -1
            ? headers.indexOf("緯度")
            : headers.indexOf("lat");

          const lngIdx = headers.indexOf("経度") !== -1
            ? headers.indexOf("経度")
            : headers.indexOf("lng");

          const addressIdx = headers.indexOf("所在地_連結表記") !== -1
            ? headers.indexOf("所在地_連結表記")
            : headers.indexOf("住所");

          if (latIdx === -1 || lngIdx === -1) {
            throw new Error("CSVの緯度・経度の列を確認してください。");
          }

          const tableBody =
            document.querySelector("#shelter-table tbody");

          tableBody.innerHTML = "";
          shelterLayerGroup.clearLayers();

          let count = 0;

          for (let i = 1; i < lines.length; i++) {
            if (!lines[i]) continue;

            const row = parseCSVLine(lines[i]);
            const lat = parseFloat(row[latIdx]);
            const lng = parseFloat(row[lngIdx]);

            const name = nameIdx !== -1
              ? row[nameIdx] || "避難所"
              : "避難所";

            const address = addressIdx !== -1
              ? row[addressIdx] || ""
              : "";

            if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
              continue;
            }

            // 地図にピンを追加
            const marker = L.marker([lat, lng], {
              icon: shelterIcon
            }).addTo(shelterLayerGroup);

            const popup = document.createElement("div");
            const title = document.createElement("b");
            title.textContent = name;

            const addressText = document.createElement("p");
            addressText.textContent = address;

            const routeButton = document.createElement("button");
            routeButton.textContent = "ここへのルートを表示";
            routeButton.onclick = () => showRoute(lat, lng, name);

            popup.append(title, addressText, routeButton);
            marker.bindPopup(popup);

            // 一覧表に追加
            const tr = document.createElement("tr");

            [name, address, lat, lng].forEach(value => {
              const td = document.createElement("td");
              td.textContent = value;
              tr.appendChild(td);
            });

            tableBody.appendChild(tr);
            count++;
          }

          document.getElementById("csv-section").style.display = "block";

          if (count === 0) {
            document.getElementById("result").textContent =
              "有効な避難所データがありません。CSVの列名を確認してください。";
          }
        })
        .catch(error => {
          console.error("CSVエラー:", error);
          alert(
            "CSVの読み込みに失敗しました。ファイル名と列名を確認してください。"
          );
        });
    }

    // =========================
    // 避難所までのルート表示
    // =========================

    async function showRoute(lat, lng, name) {
      if (!currentMarker) {
        alert("先に現在地を取得してください。");
        return;
      }

      const start = currentMarker.getLatLng();
      const resultElement = document.getElementById("result");

      resultElement.textContent = "ルートを検索しています...";

      try {
        const url =
          `https://router.project-osrm.org/route/v1/driving/` +
          `${start.lng},${start.lat};${lng},${lat}` +
          `?overview=full&geometries=geojson`;

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("通信エラー");
        }

        const data = await response.json();

        if (data.code !== "Ok" || !data.routes.length) {
          throw new Error("ルートが見つかりません");
        }

        const route = data.routes[0];

        if (routeLayer) {
          map.removeLayer(routeLayer);
        }

        routeLayer = L.geoJSON(route.geometry, {
          style: {
            color: "blue",
            weight: 6,
            opacity: 0.8
          }
        }).addTo(map);

        map.fitBounds(routeLayer.getBounds(), {
          padding: [30, 30]
        });

        const distance = (route.distance / 1000).toFixed(2);
        const minutes = Math.ceil(route.duration / 60);

        resultElement.textContent =
          `${name}までのルート：${distance} km、約${minutes}分（自動車用）`;

      } catch (error) {
        console.error("ルート検索エラー:", error);
        resultElement.textContent =
          "ルートを取得できませんでした。時間をおいて再試行してください。";
      }
    }

    // =========================
    // 防災意識チェックの設定
    // =========================

    const questions = [
      "自宅や学校の近くにある避難場所を知っていますか？",
      "避難場所までの行き方を確認していますか？",
      "自宅周辺のハザードマップを確認していますか？",
      "災害時に家族と連絡を取る方法を決めていますか？",
      "飲料水や食料などの備蓄を用意していますか？",
      "懐中電灯や予備の電池を用意していますか？",
      "非常時に持ち出す物をまとめていますか？",
      "地震や大雨などの災害情報を確認する方法を知っていますか？",
      "災害時にどこへ避難するか考えていますか？",
      "避難する際の危険な場所や道を確認していますか？"
    ];

    const choices = [
      { text: "十分にできている", score: 10 },
      { text: "ある程度できている", score: 7 },
      { text: "あまりできていない", score: 3 },
      { text: "まだできていない・わからない", score: 0 }
    ];

    let questionIndex = 0;
    let totalScore = 0;

    // 質問を表示
    function showQuestion() {
      document.getElementById("quiz-progress").textContent =
        `第${questionIndex + 1}問 / 全${questions.length}問`;

      const questionArea = document.getElementById("quiz-question");
      const choicesArea = document.getElementById("quiz-choices");

      questionArea.textContent = "";
      choicesArea.textContent = "";

      const fieldset = document.createElement("fieldset");
      const legend = document.createElement("legend");
      legend.textContent = questions[questionIndex];
      fieldset.appendChild(legend);

      choices.forEach((choice, index) => {
        const label = document.createElement("label");
        label.className = "choice";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "quiz-answer";
        radio.value = choice.score;
        radio.required = true;

        label.append(radio, document.createTextNode(" " + choice.text));
        fieldset.appendChild(label);
      });

      questionArea.appendChild(fieldset);

      document.getElementById("quiz-message").textContent = "";
      document.getElementById("quiz-next").style.display = "inline-block";
      document.getElementById("quiz-next").textContent =
        questionIndex === questions.length - 1
          ? "結果を見る"
          : "決定して次へ";
    }

    // 回答を確定して次の質問へ
    function nextQuestion() {
      const selected =
        document.querySelector('input[name="quiz-answer"]:checked');

      if (!selected) {
        document.getElementById("quiz-message").textContent =
          "選択肢を1つ選んでください。";
        return;
      }

      totalScore += Number(selected.value);
      questionIndex++;

      if (questionIndex < questions.length) {
        showQuestion();
      } else {
        showQuizResult();
      }
    }

    // 結果を表示
    function showQuizResult() {
      document.getElementById("quiz-progress").textContent =
        "全10問の回答が完了しました。";

      document.getElementById("quiz-question").textContent = "";
      document.getElementById("quiz-choices").textContent = "";
      document.getElementById("quiz-message").textContent = "";
      document.getElementById("quiz-next").style.display = "none";
      document.getElementById("quiz-finish").style.display = "block";

      const percentage = totalScore;

      document.getElementById("quiz-result").textContent =
        `あなたの防災準備スコア：${percentage} / 100点`;

      let comment = "";

      if (percentage >= 80) {
        comment =
          "多くの項目で準備ができています。定期的に備蓄や避難経路を見直しましょう。";
      } else if (percentage >= 50) {
        comment =
          "準備できている項目もあります。点数が低かった項目を少しずつ確認しましょう。";
      } else {
        comment =
          "これから準備できることがありそうです。まずは近くの避難場所や災害情報の確認から始めましょう。";
      }

      document.getElementById("quiz-comment").textContent =
        comment + " この点数は独自の目安であり、公式な判定ではありません。";
    }

    // 最初からやり直す
    function restartQuiz() {
      questionIndex = 0;
      totalScore = 0;

      document.getElementById("quiz-finish").style.display = "none";
      showQuestion();
    }

    // 最初の質問を表示
    showQuestion();
  </script>

</body>
</html>
