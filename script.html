<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現在地 ＋ 半径1km以内の避難所マップ</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    #map {
      height: 550px;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<button onclick="getLocation()">現在地を取得して半径1km以内を表示</button>
<p id="result">ボタンを押して現在地を取得してください</p>

<h1>避難所マップ</h1>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 地図の初期化
  const map = L.map("map").setView([35.0116, 135.7681], 12);

  // 地図タイルの表示（普通の標準マップ）
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // 赤色の避難所用アイコン設定
  const shelterIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  });

  // 避難所データを保持する配列とピン管理レイヤー
  let shelterDataList = [];
  const shelterLayerGroup = L.layerGroup().addTo(map);
  let currentMarker = null;

  // CSV解析関数（ダブルクォーテーション対応）
  function parseCSVLine(line) {
    const values = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        values.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    values.push(current.trim());
    return values;
  }

  // --------------------------------------------------
  // 1. バックグラウンドでCSVデータを保持（初期表示ではピンを立てない）
  // --------------------------------------------------
  function loadShelterCSV() {
    fetch("261009_evacuation_space.csv")
      .then(res => res.text())
      .then(csvText => {
        const lines = csvText.trim().split(/\r?\n/);
        if (lines.length < 2) return;

        const headers = parseCSVLine(lines[0]);
        const nameIdx = headers.indexOf("名称");
        const latIdx = headers.indexOf("緯度");
        const lngIdx = headers.indexOf("経度");
        const addressIdx = headers.indexOf("所在地_連結表記");

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i]) continue;
          const row = parseCSVLine(lines[i]);
          const lat = parseFloat(row[latIdx]);
          const lng = parseFloat(row[lngIdx]);

          if (!isNaN(lat) && !isNaN(lng)) {
            shelterDataList.push({
              name: row[nameIdx] || "避難所",
              lat: lat,
              lng: lng,
              address: addressIdx !== -1 ? (row[addressIdx] || "") : ""
            });
          }
        }
      })
      .catch(err => console.error("CSV読み込みエラー:", err));
  }

  loadShelterCSV();

  // --------------------------------------------------
  // 2. 現在地を取得し、半径1km以内の避難所ピンのみを表示
  // --------------------------------------------------
  function getLocation() {
    const resultElement = document.getElementById("result");

    if (!navigator.geolocation) {
      resultElement.textContent = "このブラウザは位置情報に対応していません。";
      return;
    }

    resultElement.textContent = "現在地を取得中...";

    navigator.geolocation.getCurrentPosition(
      function(position) {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;
        const userLatLng = L.latLng(userLat, userLng);

        // 地図を現在地に移動（拡大率15）
        map.setView([userLat, userLng], 15);

        // 既存の現在地ピン・避難所ピンをすべてクリア
        if (currentMarker) map.removeLayer(currentMarker);
        shelterLayerGroup.clearLayers();

        // 現在地に青いピンを表示
        currentMarker = L.marker([userLat, userLng])
          .addTo(map)
          .bindPopup("<b>あなたの現在地</b>")
          .openPopup();

        let count = 0;

        // 半径1km（1000m）以内の避難所のみピンを追加
        shelterDataList.forEach(shelter => {
          const shelterLatLng = L.latLng(shelter.lat, shelter.lng);
          const distance = userLatLng.distanceTo(shelterLatLng); // 距離（メートル）

          if (distance <= 1000) {
            count++;
            const distanceText = `${Math.round(distance)}m`;
            
            L.marker([shelter.lat, shelter.lng], { icon: shelterIcon })
              .bindPopup(`<b>${shelter.name}</b><br>現在地から: 約${distanceText}<br>${shelter.address}`)
              .addTo(shelterLayerGroup);
          }
        });

        resultElement.textContent = `現在地を取得しました。半径1km以内に ${count} 件の避難所があります。`;
      },
      function(error) {
        resultElement.textContent = "現在地を取得できませんでした。";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }
</script>

</body>
</html>
