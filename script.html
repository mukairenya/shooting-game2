<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現在地 ＋ 避難所マップ</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    #map {
      height: 500px;
      width: 100%;
      margin-top: 10px;
    }
    /* CSV一覧表のスタイリング */
    #table-container {
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
      position: sticky;
      top: 0;
    }
  </style>
</head>
<body>

<button onclick="getLocation()">現在地を取得して避難所を表示</button>
<p id="result">ボタンを押して現在地を取得してください</p>

<h1>避難所マップ</h1>
<div id="map"></div>

<!-- 読み込んだCSVデータを表示するエリア -->
<div id="csv-section" style="display: none;">
  <h2>読み込んだ避難所一覧（CSVデータ）</h2>
  <div id="table-container">
    <table id="shelter-table">
      <thead>
        <tr>
          <th>名称</th>
          <th>住所</th>
          <th>緯度</th>
          <th>経度</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 地図の初期化（初期設定）
  const map = L.map("map").setView([34.6853, 135.8050], 12);

  // 地図タイルの表示
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // 赤色の避難所用アイコン設定
  const shelterIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  });

  const shelterLayerGroup = L.layerGroup().addTo(map);
  let currentMarker = null;

  // CSV解析関数（ダブルクォーテーション対応）
  function parseCSVLine(line) {
    const values = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        values.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    values.push(current.trim());
    return values;
  }

  // --------------------------------------------------
  // 現在地を取得した後に実行される処理
  // --------------------------------------------------
  function getLocation() {
    const resultElement = document.getElementById("result");

    if (!navigator.geolocation) {
      resultElement.textContent = "このブラウザは位置情報に対応していません。";
      return;
    }

    resultElement.textContent = "現在地を取得中...";

    navigator.geolocation.getCurrentPosition(
      function(position) {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;

        resultElement.textContent = `現在地を取得しました (緯度: ${userLat.toFixed(4)}, 経度: ${userLng.toFixed(4)})`;

        // 地図を現在地に移動（ズームレベル 15）
        map.setView([userLat, userLng], 15);

        // 既存の現在地ピンを削除して、新しい青いピンを設置
        if (currentMarker) map.removeLayer(currentMarker);
        currentMarker = L.marker([userLat, userLng])
          .addTo(map)
          .bindPopup("<b>あなたの現在地</b>")
          .openPopup();

        // ★ 現在地を取得した後に CSV を読み込んで地図＆表に表示する
        loadAndDisplayShelterCSV();
      },
      function(error) {
        resultElement.textContent = "現在地を取得できませんでした。";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // --------------------------------------------------
  // CSV（29000_1.csv）を読み込んでピンと一覧表を表示する処理
  // --------------------------------------------------
  function loadAndDisplayShelterCSV() {
    fetch("29000_1.csv")
      .then(res => {
        if (!res.ok) throw new Error("29000_1.csv の読み込みに失敗しました。");
        return res.text();
      })
      .then(csvText => {
        const lines = csvText.trim().split(/\r?\n/);
        if (lines.length < 2) return;

        const headers = parseCSVLine(lines[0]);
        const nameIdx = headers.indexOf("名称") !== -1 ? headers.indexOf("名称") : headers.indexOf("施設名称");
        const latIdx = headers.indexOf("緯度") !== -1 ? headers.indexOf("緯度") : headers.indexOf("lat");
        const lngIdx = headers.indexOf("経度") !== -1 ? headers.indexOf("経度") : headers.indexOf("lng");
        const addressIdx = headers.indexOf("所在地_連結表記") !== -1 ? headers.indexOf("所在地_連結表記") : headers.indexOf("住所");

        // 一覧表の要素を取得してクリア
        const tableBody = document.querySelector("#shelter-table tbody");
        tableBody.innerHTML = "";
        shelterLayerGroup.clearLayers();

        let count = 0;

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i]) continue;
          const row = parseCSVLine(lines[i]);
          const lat = parseFloat(row[latIdx]);
          const lng = parseFloat(row[lngIdx]);
          const name = row[nameIdx] || "避難所";
          const address = addressIdx !== -1 ? (row[addressIdx] || "") : "";

          if (!isNaN(lat) && !isNaN(lng)) {
            // 1. 地図上にピン（赤色）を追加
            L.marker([lat, lng], { icon: shelterIcon })
              .addTo(shelterLayerGroup)
              .bindPopup(`<b>${name}</b><br>${address}`);

            // 2. CSV一覧表に行を追加
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${name}</td><td>${address}</td><td>${lat}</td><td>${lng}</td>`;
            tableBody.appendChild(tr);

            count++;
          }
        }

        // CSVデータの表を表示
        document.getElementById("csv-section").style.display = "block";
      })
      .catch(err => {
        console.error("CSVエラー:", err);
        alert("CSVファイルの読み込みに失敗しました。ファイル名が '29000_1.csv' であるか確認してください。");
      });
  }
</script>

</body>
</html>
